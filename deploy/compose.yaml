services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: [8787]
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: [node, src/worker.ts]
    env_file: ../.env
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2-alpine
    environment:
      POCKET_DOMAIN: ${POCKET_DOMAIN:?Set POCKET_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
